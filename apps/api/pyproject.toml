[project]
name = "calos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.156,<0.157", "uvicorn>=0.38,<1", "calos-domain",
  "alembic>=1.16,<2", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4"
]

[tool.uv.sources]
calos-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
