name: CalOS artifact-only frontend pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calos-autonomous-pilot
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ github.repository == 'avihafif/calibration-os' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/calos-artifact-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_task: ${{ steps.select.outputs.has_task }}
      task: ${{ steps.select.outputs.task }}
      prompt_file: ${{ steps.select.outputs.prompt_file }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      all_done: ${{ steps.select.outputs.all_done }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read current autonomy integration state
        run: |
          if git ls-remote --exit-code --heads origin autonomy/integration >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/autonomy/integration
            git checkout -B autonomy/integration FETCH_HEAD
          fi
      - name: Validate task queue
        run: python3 tools/autonomy/queue.py selftest
      - name: Avoid parallel development on top of an unfinished PR
        id: overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "An existing PR is open; defer autonomous task selection."
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select the next trusted task
        id: select
        if: steps.overlap.outputs.busy != 'true'
        run: python3 tools/autonomy/queue.py select >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.select.outputs.has_task == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        if: steps.select.outputs.has_task == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Preinstall approved dependencies outside the agent
        if: steps.select.outputs.has_task == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Codex implements one bounded task
        if: steps.select.outputs.has_task == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: ${{ steps.select.outputs.prompt_file }}
          output-file: ${{ runner.temp }}/codex-result.txt
      - name: Validate the agent change set and export a patch
        if: steps.select.outputs.has_task == 'true'
        env:
          TASK_ID: ${{ steps.select.outputs.task }}
        run: |
          git add -A
          git diff --cached --name-only -z | python3 -c 'import sys; p=sys.stdin.buffer.read().split(b"\0"); assert not any(x.startswith((b".github/",b"tools/autonomy/",b".calos-autonomy/",b"docs/adr/",b"deploy/")) for x in p if x), "PROTECTED_CONTROL_PLANE_CHANGE"'
          python3 tools/autonomy/queue.py check --task "$TASK_ID"
          git diff --cached --binary > "$RUNNER_TEMP/candidate.patch"
          test -s "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.has_task == 'true'
        with:
          name: calos-candidate
          path: ${{ runner.temp }}/candidate.patch
          if-no-files-found: error
          retention-days: 5

  verify:
    needs: implement
    if: needs.implement.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: calos-candidate
          path: ${{ runner.temp }}
      - name: Apply exact candidate under test
        run: git apply --check "$RUNNER_TEMP/candidate.patch" && git apply "$RUNNER_TEMP/candidate.patch"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend, architecture, localization and supply-chain gates
        run: |
          pnpm check:ts
          pnpm check:browser-types
          pnpm lint:ts
          pnpm format:ts:check
          pnpm test:ts-boundary
          pnpm lint:logical-css
          pnpm test:schema-vectors
          pnpm test:frontend
          pnpm build:web
          node tools/check_frontend_bundle.mjs
          pnpm audit
          pnpm sbom --sbom-format cyclonedx > frontend-sbom.json
          node tools/check_frontend_supply_chain.mjs frontend-sbom.json
      - name: Browser test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python regression tests
        run: |
          python -m pip install uv==0.13.6
          uv sync --all-packages --frozen
          uv run --no-sync python tools/check.py
          uv run --no-sync python -m unittest discover -s tests/security
          uv run --no-sync ruff check apps packages/py tools tests
          uv run --no-sync ruff format --check apps packages/py tools tests

  review:
    needs: implement
    if: needs.implement.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: calos-candidate
          path: ${{ runner.temp }}
      - name: Apply exact candidate for read-only independent agent review
        run: |
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          cp "$RUNNER_TEMP/candidate.patch" candidate-for-review.patch
      - name: Claude reports code findings
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Independently review candidate-for-review.patch and its actual changed files
            against AGENTS.md, accepted ADR-0001/0015/0026 and the scoped trusted
            frontend task. You are reviewing an AI change to a Test/simulation-only
            calibration product. Never invent approvals, run operational tools, or
            treat yourself as a human security/metrology reviewer.
            Report any weakened safety boundary, new operational behavior, dependency
            changes, test bypasses, or missing important tests. Report findings only.
            Do not issue approvals or release decisions.
            You have read-only file tools. Return structured JSON with a short,
            evidence-grounded summary and findings.
          claude_args: >-
            --max-turns 16
            --allowedTools Read,Glob,Grep
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}}},"required":["summary","findings"],"additionalProperties":false}'
      - name: Validate structured findings and retain evidence
        env:
          CLAUDE_JSON: ${{ steps.claude.outputs.structured_output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(os.environ["CLAUDE_JSON"])
          assert isinstance(result["summary"], str) and result["summary"].strip()
          assert isinstance(result["findings"], list)
          Path("review.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("verdict=" + result["verdict"] + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calos-independent-agent-review
          path: review.json
          retention-days: 30
