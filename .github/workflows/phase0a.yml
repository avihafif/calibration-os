name: Phase 0A checks

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Sync locked workspace
        run: uv sync --all-packages --frozen
      - name: Contract and unit checks
        run: uv run --no-sync python tools/check.py
      - name: Phase 0B signature, authentication and tamper vectors
        run: uv run --no-sync python -m unittest discover -s tests/security -v
      - name: Python lint
        run: uv run --no-sync ruff check apps packages/py tools tests
      - name: Python format
        run: uv run --no-sync ruff format --check apps packages/py tools tests
      - name: Python typing
        run: uv run --no-sync mypy --strict packages/py/calos_domain/calos_domain packages/py/calos_metadata/calos_metadata packages/py/calos_security/calos_security apps/api/calos_api tests/typing/lifecycle_required.py tests/typing/schema_proof.py
      - name: Import boundaries
        run: uv run --no-sync lint-imports --no-cache

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:ts
      - run: pnpm check:browser-types
      - run: pnpm lint:ts
      - run: pnpm format:ts:check
      - run: pnpm test:ts-boundary
      - run: pnpm lint:logical-css
      - run: pnpm test:schema-vectors
      - run: pnpm test:frontend
      - run: pnpm build:web
      - run: node tools/check_frontend_bundle.mjs
      - name: Verify Production Rehearsal artifact markings and fixture exclusion
        run: |
          VITE_ENVIRONMENT_KIND=production_rehearsal pnpm build:web
          VITE_ENVIRONMENT_KIND=production_rehearsal node tools/check_frontend_bundle.mjs
      - name: Generate CycloneDX SBOM
        run: pnpm sbom --sbom-format cyclonedx > frontend-sbom.json
      - name: OSV and licence verification
        if: always()
        run: node tools/check_frontend_supply_chain.mjs frontend-sbom.json
      - name: pnpm audit
        if: always()
        run: pnpm audit
      - name: Upload development SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-1a-1a-dev-sbom
          path: frontend-sbom.json
          if-no-files-found: warn
  compose-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate disposable secrets
        run: python tools/setup_rehearsal_secrets.py
      - name: Check static separation and generated credentials
        run: python tools/check_isolation.py --with-secrets
      - name: Validate Compose projects
        run: |
          docker compose -f deploy/test/compose.yaml config --quiet
          docker compose -f deploy/prod-rehearsal/compose.yaml config --quiet
      - name: Start and migrate Test
        run: |
          docker compose -f deploy/test/compose.yaml up -d --build db
          docker compose -f deploy/test/compose.yaml run --rm migrate
          docker compose -f deploy/test/compose.yaml run --rm migrate python tools/check_postgres.py
      - name: Start and migrate Production rehearsal
        run: |
          docker compose -f deploy/prod-rehearsal/compose.yaml up -d --build db
          docker compose -f deploy/prod-rehearsal/compose.yaml run --rm migrate
          docker compose -f deploy/prod-rehearsal/compose.yaml run --rm migrate python tools/check_postgres.py
      - name: Run non-operational shells
        run: |
          docker compose -f deploy/test/compose.yaml up -d --build api station_stub web
          docker compose -f deploy/prod-rehearsal/compose.yaml up -d --build api station_stub web
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:18081/local/v1/status
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:18082/
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:28080/healthz
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:28081/local/v1/status
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:28082/
      - name: Verify package route fails closed without operational trust
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --data '{}' http://127.0.0.1:18080/api/v1/config/packages/verify)" = "503"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --data '{}' http://127.0.0.1:28080/api/v1/config/packages/verify)" = "503"
      - name: Stop disposable stacks
        if: always()
        run: |
          docker compose -f deploy/test/compose.yaml down -v --remove-orphans
          docker compose -f deploy/prod-rehearsal/compose.yaml down -v --remove-orphans

  frontend-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:web
      - name: Install pinned Chromium for CI only
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload bilingual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-1a-1a-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
