<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Demo V1 wireframe: Operations dashboard (English, light)</title>
  <desc id="d">Composition only. Synthetic figures. Colours are the approved Phase 1A light tokens; protected markings are fixed.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #121821; font-size: 14px; }
    .m { fill: #475467; } .b { font-weight: 700; } .h1 { font-size: 26px; font-weight: 700; } .h2 { font-size: 16px; font-weight: 700; }
    .big { font-size: 34px; font-weight: 700; } .sm { font-size: 12px; } .on { fill: #ffffff; font-weight: 700; font-size: 12px; }
    .card { fill: #ffffff; stroke: #d5dbe5; } .ctl { fill: #ffffff; stroke: #7a899e; }
  </style>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <!-- protected markings (fixed, non-themeable) -->
  <rect x="0" y="0" width="1200" height="30" fill="#f0e9fc"/>
  <text x="600" y="20" text-anchor="middle" class="b" style="fill:#6d28d9">◆ TEST · SIMULATION ONLY · NOT A CALIBRATION · NON-OPERATIONAL</text>
  <!-- top bar -->
  <rect x="0" y="30" width="1200" height="48" fill="#ffffff" stroke="#d5dbe5"/>
  <text x="20" y="61" class="h2">CalOS</text>
  <rect x="90" y="42" width="52" height="24" rx="4" fill="#0a5f8c"/><text x="116" y="59" text-anchor="middle" class="on">TEST</text>
  <rect x="150" y="42" width="104" height="24" rx="4" fill="#6d28d9"/><text x="202" y="59" text-anchor="middle" class="on">SIMULATION</text>
  <rect x="860" y="42" width="140" height="24" rx="4" class="ctl"/><text x="930" y="59" text-anchor="middle" class="sm">Host: simulated · unknown</text>
  <rect x="1012" y="42" width="84" height="24" rx="4" class="ctl"/><text x="1054" y="59" text-anchor="middle" class="sm">EN | עב</text>
  <rect x="1106" y="42" width="74" height="24" rx="4" class="ctl"/><text x="1143" y="59" text-anchor="middle" class="sm">◐ Theme</text>
  <!-- side navigation -->
  <rect x="0" y="78" width="210" height="642" fill="#ffffff" stroke="#d5dbe5"/>
  <g class="sm">
    <text x="20" y="108">Overview</text><text x="20" y="136">Technical text</text><text x="20" y="164">Forms</text><text x="20" y="192">Data views</text><text x="20" y="220">Host status</text>
    <text x="20" y="256" class="m b">DEMO V1 · SYNTHETIC</text>
    <rect x="8" y="270" width="194" height="32" rx="4" fill="#e4f1f8"/><text x="20" y="291" class="b" style="fill:#0a5f8c">▣ Dashboard</text>
    <text x="20" y="324">▤ Work orders</text><text x="20" y="352">▥ Job setup</text><text x="20" y="380">▶ Run console</text><text x="20" y="408">▧ Results &amp; report</text>
  </g>
  <!-- main -->
  <text x="236" y="122" class="h1">Operations dashboard</text>
  <rect x="520" y="104" width="112" height="26" rx="13" fill="#f0e9fc"/><text x="576" y="122" text-anchor="middle" class="sm b" style="fill:#6d28d9">synthetic_demo</text>
  <text x="236" y="148" class="m sm">All figures are synthetic and computed from this browser tab only. Reload resets everything.</text>
  <!-- KPI tiles -->
  <g>
    <rect x="236" y="168" width="224" height="104" rx="8" class="card"/><text x="252" y="196" class="m sm">Open work orders</text><text x="252" y="238" class="big">8</text><text x="252" y="260" class="m sm">▲ 3 received · 2 ready</text>
    <rect x="474" y="168" width="224" height="104" rx="8" class="card"/><text x="490" y="196" class="m sm">Instruments available</text><text x="490" y="238" class="big">5 / 8</text><text x="490" y="260" class="m sm">⚠ 1 needs attention</text>
    <rect x="712" y="168" width="224" height="104" rx="8" class="card"/><text x="728" y="196" class="m sm">Jobs ready to simulate</text><text x="728" y="238" class="big">2</text><text x="728" y="260" class="m sm">✔ preflight clear</text>
    <rect x="950" y="168" width="224" height="104" rx="8" class="card"/><text x="966" y="196" class="m sm">Simulated runs (this session)</text><text x="966" y="238" class="big">0</text><text x="966" y="260" class="m sm">● none yet</text>
  </g>
  <!-- status meters -->
  <rect x="236" y="292" width="470" height="300" rx="8" class="card"/>
  <text x="252" y="322" class="h2">Work orders by status</text>
  <g class="sm">
    <text x="252" y="356">Received</text><rect x="372" y="344" width="240" height="14" rx="3" fill="#edf1f6"/><rect x="372" y="344" width="120" height="14" rx="3" fill="#0a5f8c"/><text x="630" y="356" class="b">3</text>
    <text x="252" y="392">Ready</text><rect x="372" y="380" width="240" height="14" rx="3" fill="#edf1f6"/><rect x="372" y="380" width="80" height="14" rx="3" fill="#0a5f8c"/><text x="630" y="392" class="b">2</text>
    <text x="252" y="428">In simulation</text><rect x="372" y="416" width="240" height="14" rx="3" fill="#edf1f6"/><rect x="372" y="416" width="40" height="14" rx="3" fill="#6d28d9"/><text x="630" y="428" class="b">1</text>
    <text x="252" y="464">Demo report ready</text><rect x="372" y="452" width="240" height="14" rx="3" fill="#edf1f6"/><rect x="372" y="452" width="80" height="14" rx="3" fill="#14693f"/><text x="630" y="464" class="b">2</text>
    <text x="252" y="500" class="m">Each bar has its number and label as text; a table view is one click away.</text>
    <rect x="252" y="526" width="150" height="34" rx="4" class="ctl"/><text x="327" y="548" text-anchor="middle" class="sm">Show as table</text>
  </g>
  <!-- next step + activity -->
  <rect x="722" y="292" width="452" height="124" rx="8" class="card"/>
  <text x="738" y="322" class="h2">Start the demonstration path</text>
  <text x="738" y="346" class="m sm">Pick a synthetic work order, set up a job, run a scripted simulation,</text><text x="738" y="364" class="m sm">then read the watermarked demonstration report.</text>
  <rect x="738" y="376" width="190" height="32" rx="4" fill="#1b4fd1"/><text x="833" y="397" text-anchor="middle" class="on">Open work orders →</text>
  <rect x="722" y="432" width="452" height="160" rx="8" class="card"/>
  <text x="738" y="462" class="h2">Activity (this session)</text>
  <text x="738" y="490" class="m sm">Nothing yet. Events from simulated runs appear here.</text>
  <text x="738" y="512" class="m sm">Journal: simulated, not persisted.</text>
  <!-- status bar -->
  <rect x="0" y="720" width="1200" height="40" fill="#ffffff" stroke="#d5dbe5"/>
  <text x="20" y="745" class="sm m">Test workspace · no operational actions · Hebrew text needs review</text>
</svg>
