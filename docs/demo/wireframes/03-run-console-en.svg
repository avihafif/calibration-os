<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Demo V1 wireframe: Simulated execution console (English, light)</title>
  <desc id="d">Composition only. Every value is scripted and synthetic; units are the synthetic unit su; no limits, tolerances or safety values are shown.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #121821; font-size: 14px; }
    .m { fill: #475467; } .b { font-weight: 700; } .h1 { font-size: 26px; font-weight: 700; } .h2 { font-size: 16px; font-weight: 700; }
    .sm { font-size: 12px; } .on { fill: #ffffff; font-weight: 700; font-size: 12px; } .mono { font-family: Consolas, "Courier New", monospace; }
    .card { fill: #ffffff; stroke: #d5dbe5; } .ctl { fill: #ffffff; stroke: #7a899e; }
  </style>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1200" height="30" fill="#f0e9fc"/>
  <text x="600" y="20" text-anchor="middle" class="b" style="fill:#6d28d9">◆ TEST · SIMULATION ONLY · NOT A CALIBRATION · NON-OPERATIONAL</text>
  <rect x="0" y="30" width="1200" height="48" fill="#ffffff" stroke="#d5dbe5"/>
  <text x="20" y="61" class="h2">CalOS</text>
  <rect x="90" y="42" width="52" height="24" rx="4" fill="#0a5f8c"/><text x="116" y="59" text-anchor="middle" class="on">TEST</text>
  <rect x="150" y="42" width="104" height="24" rx="4" fill="#6d28d9"/><text x="202" y="59" text-anchor="middle" class="on">SIMULATION</text>
  <text x="236" y="112" class="h1">Simulated execution console</text>
  <!-- run header -->
  <rect x="236" y="128" width="944" height="84" rx="8" class="card"/>
  <rect x="236" y="128" width="6" height="84" rx="3" fill="#6d28d9"/>
  <text x="256" y="156" class="b mono">SIM-RUN-0001</text>
  <text x="380" y="156" class="m sm">Synthetic procedure</text><text x="490" y="156" class="mono sm">SYN-PROC-001 v1.0.0</text>
  <rect x="256" y="170" width="132" height="26" rx="13" fill="#f0e9fc"/><text x="322" y="188" text-anchor="middle" class="sm b" style="fill:#6d28d9">● RUNNING (scripted)</text>
  <text x="404" y="188" class="m sm">Simulated elapsed t+00:07 · Step 7 of 11</text>
  <g>
    <rect x="800" y="146" width="84" height="34" rx="4" fill="#1b4fd1"/><text x="842" y="168" text-anchor="middle" class="on">Step ▸</text>
    <rect x="892" y="146" width="108" height="34" rx="4" class="ctl"/><text x="946" y="168" text-anchor="middle" class="sm">Run to end</text>
    <rect x="1008" y="146" width="80" height="34" rx="4" class="ctl"/><text x="1048" y="168" text-anchor="middle" class="sm">Abort…</text>
    <rect x="1096" y="146" width="76" height="34" rx="4" class="ctl"/><text x="1134" y="168" text-anchor="middle" class="sm">Reset</text>
  </g>
  <!-- steps -->
  <rect x="236" y="228" width="260" height="400" rx="8" class="card"/>
  <text x="252" y="256" class="h2">Steps</text>
  <g class="sm">
    <text x="252" y="286">✔ Setup · confirm note</text>
    <text x="252" y="312" class="b">▾ Points</text>
    <text x="272" y="336">✔ Point A (3 of 3)</text>
    <rect x="262" y="346" width="224" height="26" rx="4" fill="#f0e9fc"/><text x="272" y="364" class="b" style="fill:#6d28d9">▶ Point B (2 of 3)</text>
    <text x="272" y="392" class="m">○ Point C (0 of 3)</text>
    <text x="252" y="420">○ Teardown · scripted</text>
    <text x="252" y="456" class="m b">Evidence (scripted)</text>
    <text x="252" y="478" class="m">▫ Environment note · scripted</text>
    <text x="252" y="498" class="m">▫ Instrument state · simulated</text>
  </g>
  <!-- now panel -->
  <rect x="512" y="228" width="668" height="214" rx="8" class="card"/>
  <text x="528" y="256" class="h2">Now · Point B</text>
  <text x="528" y="282" class="m sm">Scripted demonstration reading (not measured, not computed)</text>
  <text x="528" y="326" class="m sm">Reading 2 of 3</text><text x="528" y="364" style="font-size:34px;font-weight:700" class="mono">12.3401 su</text>
  <text x="780" y="326" class="m sm">Test point value</text><text x="780" y="352" class="sm">Input required <tspan class="mono">MI-03</tspan> (not authored)</text>
  <text x="780" y="384" class="m sm">Limit check</text><text x="780" y="408" class="sm">Not evaluated — input required <tspan class="mono">MI-04</tspan></text>
  <!-- readings table -->
  <rect x="512" y="458" width="668" height="170" rx="8" class="card"/>
  <text x="528" y="486" class="h2">Readings (live, scripted)</text>
  <rect x="520" y="498" width="652" height="24" fill="#edf1f6"/>
  <g class="sm b"><text x="528" y="514">Point</text><text x="620" y="514">#</text><text x="680" y="514">Value (su)</text><text x="820" y="514">Limit check</text></g>
  <g class="sm mono">
    <text x="528" y="542">A</text><text x="620" y="542">1</text><text x="680" y="542">11.0012</text>
    <text x="528" y="566">A</text><text x="620" y="566">2</text><text x="680" y="566">11.0009</text>
    <text x="528" y="590">B</text><text x="620" y="590">1</text><text x="680" y="590">12.3398</text>
    <text x="528" y="614">B</text><text x="620" y="614">2</text><text x="680" y="614">12.3401</text>
  </g>
  <g class="sm"><text x="820" y="542">Not evaluated</text><text x="820" y="566">Not evaluated</text><text x="820" y="590">Not evaluated</text><text x="820" y="614">Not evaluated</text></g>
  <!-- operator prompt + log -->
  <rect x="236" y="644" width="520" height="68" rx="8" fill="#fbf0dc" stroke="#8f4a00"/>
  <text x="252" y="668" class="b" style="fill:#8f4a00">⚠ Operator step (scripted)</text>
  <text x="252" y="690" class="sm">Confirm that the synthetic setup note was read.</text>
  <rect x="640" y="660" width="100" height="34" rx="4" fill="#1b4fd1"/><text x="690" y="682" text-anchor="middle" class="on">Confirm</text>
  <rect x="772" y="644" width="408" height="68" rx="8" class="card"/>
  <text x="788" y="668" class="h2">Event log</text><text x="788" y="690" class="sm mono">t+00:07  Point B · reading 2 recorded (scripted)</text>
  <rect x="0" y="720" width="1200" height="40" fill="#ffffff" stroke="#d5dbe5"/>
  <text x="20" y="745" class="sm m">Journal: simulated, not persisted · Safety: not applicable (no instrument) · Sync: not applicable</text>
</svg>
