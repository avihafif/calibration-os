<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>CalOS Application Builder — design prototype</title>
<link rel="stylesheet" href="css/app.css">
</head>

<a class="skip" id="skip" href="#main">Skip to content</a>
<div id="app">

  <div class="shell">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="main" tabindex="-1"></main>
