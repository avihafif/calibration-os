[project]
name = "calos-security"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "calos-domain", "calos-metadata",
  "cryptography>=50,<51", "PyJWT>=2.15,<3"
]

[tool.uv.sources]
calos-domain = { workspace = true }
calos-metadata = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
