[project]
name = "calos-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
  "import-linter>=2,<3"
]

[tool.uv.workspace]
members = ["apps/api", "apps/station-agent", "packages/py/calos_domain", "packages/py/calos_metadata", "packages/py/calos_security"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

